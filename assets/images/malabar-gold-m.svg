<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- 1. Rich Luxury Metallic Gold Gradient (userSpaceOnUse for exact rendering across all browsers) -->
    <linearGradient id="malabarGoldLustre" gradientUnits="userSpaceOnUse" x1="15" y1="12" x2="85" y2="88">
      <stop offset="0%" stop-color="#FFF8E0"/>
      <stop offset="16%" stop-color="#FCDD85"/>
      <stop offset="38%" stop-color="#D9A838"/>
      <stop offset="58%" stop-color="#FFF2C6"/>
      <stop offset="78%" stop-color="#BF8A20"/>
      <stop offset="100%" stop-color="#80550E"/>
    </linearGradient>

    <!-- 2. Specular Top-Left Chisel Highlight -->
    <linearGradient id="malabarGoldHighlight" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="60" y2="60">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFF9DE" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#E5BF60" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#996D15" stop-opacity="0"/>
    </linearGradient>

    <!-- 3. Deep Warm Contact Shadow Gradient -->
    <linearGradient id="malabarGoldShadow" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="80" y2="80">
      <stop offset="0%" stop-color="#6B4608"/>
      <stop offset="100%" stop-color="#3D2500"/>
    </linearGradient>

    <!-- 4. 3D Spherical Radial Gradient for the Golden Pearl / Bindu -->
    <radialGradient id="malabarGoldSphere" cx="36%" cy="32%" r="66%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFF5CE"/>
      <stop offset="50%" stop-color="#E5B94A"/>
      <stop offset="80%" stop-color="#B37E16"/>
      <stop offset="100%" stop-color="#5E3C03"/>
    </radialGradient>

    <!-- 5. Realistic Soft Drop Shadow / Ambient Occlusion -->
    <filter id="malabarRealDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#473005" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#malabarRealDepth)">
    <!-- 1. BASE DEPTH RELIEF / CONTACT SHADOW LAYER -->
    <g stroke="url(#malabarGoldShadow)" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" transform="translate(0, 0.7)">
      <line x1="22" y1="16" x2="22" y2="84" stroke-width="5.6"/>
      <line x1="78" y1="16" x2="78" y2="84" stroke-width="5.6"/>
      <line x1="22" y1="16" x2="57" y2="56" stroke-width="5.6"/>
      <line x1="78" y1="16" x2="43" y2="56" stroke-width="5.6"/>
    </g>

    <!-- 2. MAIN REALISTIC METALLIC GOLD BODY -->
    <g stroke="url(#malabarGoldLustre)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Stem -->
      <line x1="22" y1="16" x2="22" y2="84" stroke-width="5.4"/>
      
      <!-- Right Stem -->
      <line x1="78" y1="16" x2="78" y2="84" stroke-width="5.4"/>
      
      <!-- Left Diagonal crossing down to right wing -->
      <line x1="22" y1="16" x2="57" y2="56" stroke-width="5.4"/>
      
      <!-- Right Diagonal crossing down to left wing -->
      <line x1="78" y1="16" x2="43" y2="56" stroke-width="5.4"/>
    </g>

    <!-- 3. TOP-LEFT SPECULAR CHISEL HIGHLIGHT (3D Metallic Light Reflection) -->
    <g stroke="url(#malabarGoldHighlight)" stroke-linecap="round" stroke-linejoin="round" transform="translate(-0.4, -0.4)">
      <line x1="22" y1="16.5" x2="22" y2="83.5" stroke-width="1.8"/>
      <line x1="78" y1="16.5" x2="78" y2="83.5" stroke-width="1.8"/>
      <line x1="22" y1="16.5" x2="56.5" y2="55.5" stroke-width="1.8"/>
      <line x1="78" y1="16.5" x2="43.5" y2="55.5" stroke-width="1.8"/>
    </g>

    <!-- 4. REALISTIC 3D GOLDEN BINDU / PEARL -->
    <!-- Soft shadow behind pearl -->
    <circle cx="50" cy="64.6" r="3.9" fill="url(#malabarGoldShadow)" opacity="0.35"/>
    <!-- 3D Pearl Body -->
    <circle cx="50" cy="64" r="3.9" fill="url(#malabarGoldSphere)"/>
    <!-- Micro Specular Glint on Pearl -->
    <circle cx="48.8" cy="62.8" r="1.1" fill="#FFFFFF" opacity="0.75"/>
  </g>
</svg>
